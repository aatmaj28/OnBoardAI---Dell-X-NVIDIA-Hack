name: Deploy LearnBot UI

on:
  push:
    branches:
      - dynamic-update # UAT branch (matching deploy.sh)
      - main # PROD branch
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "UAT"
        type: choice
        options:
          - UAT
          - PROD
      branch:
        description: "Branch to deploy (optional, defaults to env branch)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: self-hosted
    concurrency:
      group: deploy-learnbot-ui-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'PROD' || 'UAT') }}
      cancel-in-progress: false

    steps:
      # ======= SETUP ENVIRONMENT =======
      - name: Setup deployment environment
        id: setup
        run: |
          # Determine environment based on branch (matching deploy.sh logic)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            DEPLOY_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            DEPLOY_ENV="PROD"
          else
            DEPLOY_ENV="UAT"
          fi

          # Set environment variables and paths (matching deploy.sh exactly)
          DEPLOY_ENV_LOWER=$(echo "$DEPLOY_ENV" | tr '[:upper:]' '[:lower:]')

          case "$DEPLOY_ENV" in
            PROD)
              REPO_DIR="/var/www/LearnBot-UI"
              PM2_NAMESPACE="prod"
              LOG_DIR="/var/www/LearnBot-UI/logs"
              UI_PORT=3030
              PM2_ENV_FLAG="--env production"
              APP_NAME="learnbot-ui"
              DEFAULT_BRANCH="main"
              ;;
            UAT)
              REPO_DIR="/var/www/LearnBot-UI-UAT"
              PM2_NAMESPACE="uat"
              LOG_DIR="/var/www/LearnBot-UI-UAT/logs"
              UI_PORT=3031
              PM2_ENV_FLAG=""
              APP_NAME="learnbot-ui-uat"
              DEFAULT_BRANCH="dynamic-update"
              ;;
            *)
              echo "❌ Unknown environment: $DEPLOY_ENV"
              echo "   Expected: UAT or PROD"
              exit 1
              ;;
          esac

          # Export to GitHub environment and outputs
          echo "DEPLOY_ENV=$DEPLOY_ENV" >> $GITHUB_ENV
          echo "deploy_env=$DEPLOY_ENV" >> $GITHUB_OUTPUT
          echo "deploy_env_lower=$DEPLOY_ENV_LOWER" >> $GITHUB_OUTPUT
          echo "repo_dir=$REPO_DIR" >> $GITHUB_OUTPUT
          echo "pm2_namespace=$PM2_NAMESPACE" >> $GITHUB_OUTPUT
          echo "log_dir=$LOG_DIR" >> $GITHUB_OUTPUT
          echo "ui_port=$UI_PORT" >> $GITHUB_OUTPUT
          echo "pm2_env_flag=$PM2_ENV_FLAG" >> $GITHUB_OUTPUT
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "default_branch=$DEFAULT_BRANCH" >> $GITHUB_OUTPUT
          echo "env_file=$REPO_DIR/.env.$DEPLOY_ENV_LOWER" >> $GITHUB_OUTPUT

      # ======= SETUP LOG DIRECTORY =======
      - name: Setup log directory
        run: |
          LOG_DIR="${{ steps.setup.outputs.log_dir }}"
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"

          # Create log directory with proper permissions
          sudo mkdir -p "$LOG_DIR"
          sudo chown deploy:deploy "$LOG_DIR"
          sudo chmod 755 "$LOG_DIR"

          echo "✅ Log directory created: $LOG_DIR"

          # Clean up old log files (older than 30 days)
          sudo -u deploy find "$LOG_DIR" -name "*.log" -mtime +30 -delete 2>/dev/null || true
          echo "🧹 Cleaned up old log files"

      # ======= GIT CONFIG & CHECKOUT =======
      - name: Configure Git and checkout
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}

      # ======= NODE.JS SETUP =======
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      # ======= NOTIFICATIONS =======
      - name: Teams Notification - Starting
        uses: jdcargile/ms-teams-notification@v1.4
        if: ${{ secrets.TEAMS_WEBHOOK_URL != '' }}
        with:
          github-token: ${{ github.token }}
          ms-teams-webhook-uri: ${{ secrets.TEAMS_WEBHOOK_URL }}
          notification-summary: "🚀 Deploying LearnBot UI to ${{ env.DEPLOY_ENV }}"
          notification-color: "0076D7"

      # ======= BACKUP =======
      - name: Backup current deployment
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          BACKUP_DIR="$REPO_DIR/backups"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          sudo -u deploy mkdir -p "$BACKUP_DIR"
          if [ -d "$REPO_DIR" ] && [ "$(ls -A $REPO_DIR 2>/dev/null)" ]; then
            echo "📦 Creating backup..."
            sudo -u deploy tar -czf "$BACKUP_DIR/backup-$TIMESTAMP.tar.gz" \
              -C "$REPO_DIR" \
              --exclude="node_modules" \
              --exclude=".next" \
              --exclude="*.log" \
              --exclude="backups" \
              --exclude="qdrant_storage" \
              . 2>/dev/null || true
          fi

      # ======= UPDATE GIT REMOTE =======
      - name: Update Git remote with current PAT
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          cd "$REPO_DIR"
          sudo -u deploy git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}
          echo "✅ Updated Git remote URL with current PAT"

      # ======= UPDATE CODE =======
      - name: Pull latest code
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          DEFAULT_BRANCH="${{ steps.setup.outputs.default_branch }}"

          # Use branch from workflow_dispatch input or default to environment branch
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.branch }}" ]; then
            DEPLOY_BRANCH="${{ github.event.inputs.branch }}"
          else
            DEPLOY_BRANCH="${{ github.ref_name }}"
            # If ref_name doesn't match expected branch, use default for environment
            if [ "$DEPLOY_BRANCH" != "$DEFAULT_BRANCH" ]; then
              DEPLOY_BRANCH="$DEFAULT_BRANCH"
            fi
          fi

          cd "$REPO_DIR"

          # Discard any local changes to ensure clean state
          echo "🧹 Discarding local changes..."
          sudo -u deploy git reset --hard HEAD

          # Clean untracked files, excluding runtime directories
          sudo -u deploy git clean -fd \
            -e qdrant_storage \
            -e backups \
            -e logs \
            2>&1 | grep -v "Permission denied" || true

          # Fetch and checkout
          sudo -u deploy git fetch --all
          sudo -u deploy git checkout "$DEPLOY_BRANCH"

          # Reset to remote branch to ensure we're in sync
          sudo -u deploy git reset --hard "origin/$DEPLOY_BRANCH"

          echo "✅ Pulled latest code from branch: $DEPLOY_BRANCH"

      # ======= CREATE ENV FILE =======
      - name: Create environment file
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          cd "$REPO_DIR"

          # Get backend API URL from secrets (environment-specific)
          LEARNBOT_API_URL="${{ secrets[format('LEARNBOT_API_URL_{0}', env.DEPLOY_ENV)] }}"

          if [ -z "$LEARNBOT_API_URL" ]; then
            echo "❌ ERROR: LEARNBOT_API_URL_${{ env.DEPLOY_ENV }} secret is missing!"
            echo "   This should be the backend API URL:"
            echo "   UAT: http://129.10.224.227:8031"
            echo "   PROD: http://129.10.224.227:8030"
            exit 1
          fi

          # Create .env file with all variables
          sudo -u deploy bash -c "cat > .env.${{ steps.setup.outputs.deploy_env_lower }} << EOF
          NODE_ENV=production
          NAMESPACE=${{ steps.setup.outputs.pm2_namespace }}
          PORT=${{ steps.setup.outputs.ui_port }}
          NEXT_PUBLIC_FLASK_API_URL=${{ secrets[format('LEARNBOT_API_URL_{0}', env.DEPLOY_ENV)] }}
          NEXT_PUBLIC_ENVIRONMENT=${{ env.DEPLOY_ENV }}
          LOG_LEVEL=${{ steps.setup.outputs.pm2_namespace == 'prod' && 'info' || 'debug' }}
          EOF"

          echo "✅ Environment file created: .env.${{ steps.setup.outputs.deploy_env_lower }}"

      # ======= INSTALL DEPENDENCIES =======
      - name: Install Node.js dependencies
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          ENV_FILE="${{ steps.setup.outputs.env_file }}"

          echo "📦 Installing Node.js dependencies..."
          cd "$REPO_DIR"
          sudo -u deploy cp "$ENV_FILE" .env
          sudo -u deploy npm ci || sudo -u deploy npm install
          echo "✅ Node.js dependencies installed"

      # ======= BUILD APPLICATION =======
      - name: Build Next.js application
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          ENV_FILE="${{ steps.setup.outputs.env_file }}"

          echo "📦 Building Next.js application..."
          cd "$REPO_DIR"
          sudo -u deploy cp "$ENV_FILE" .env

          # Clear Next.js build cache
          echo "🧹 Clearing Next.js cache..."
          sudo -u deploy rm -rf .next 2>/dev/null || true

          # Verify .env file has correct values
          echo "🔍 Verifying build-time environment variables:"
          sudo -u deploy bash -c "
            set -a
            source .env
            set +a
            echo '  NEXT_PUBLIC_FLASK_API_URL='\$NEXT_PUBLIC_FLASK_API_URL
            echo '  NAMESPACE='\$NAMESPACE
          "

          # Build with exported env vars
          sudo -u deploy bash -c "
            export NEXT_PUBLIC_FLASK_API_URL=\$(grep '^NEXT_PUBLIC_FLASK_API_URL=' .env | cut -d '=' -f2- | tr -d '\"' | tr -d \"'\")
            export NEXT_PUBLIC_ENVIRONMENT=\$(grep '^NEXT_PUBLIC_ENVIRONMENT=' .env | cut -d '=' -f2- | tr -d '\"' | tr -d \"'\")
            export NAMESPACE=\$(grep '^NAMESPACE=' .env | cut -d '=' -f2- | tr -d '\"' | tr -d \"'\")
            export NODE_ENV=production
            
            echo '🔍 Building with environment variables:'
            echo '  NEXT_PUBLIC_FLASK_API_URL='\$NEXT_PUBLIC_FLASK_API_URL
            echo '  NAMESPACE='\$NAMESPACE
            
            npm run build
          "
          echo "✅ Next.js build complete"

      # ======= RESTART PM2 SERVICES =======
      - name: Restart PM2 service (zero downtime)
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          ENV_FILE="${{ steps.setup.outputs.env_file }}"
          PM2_NAMESPACE="${{ steps.setup.outputs.pm2_namespace }}"
          APP_NAME="${{ steps.setup.outputs.app_name }}"
          PM2_ENV_FLAG="${{ steps.setup.outputs.pm2_env_flag }}"

          cd "$REPO_DIR"
          sudo -u deploy cp "$ENV_FILE" .env

          # Flush old PM2 logs
          echo "🧹 Flushing PM2 logs..."
          sudo -u deploy pm2 flush

          # Zero downtime reload if exists, otherwise start
          echo "🔄 Managing UI service..."
          if sudo -u deploy pm2 describe "$APP_NAME" --namespace "$PM2_NAMESPACE" >/dev/null 2>&1; then
            echo "  ↻ Reloading $APP_NAME (zero downtime)..."
            sudo -u deploy pm2 stop "$APP_NAME" --namespace "$PM2_NAMESPACE"
            sudo -u deploy NAMESPACE="$PM2_NAMESPACE" pm2 start ecosystem.config.js $PM2_ENV_FLAG --namespace "$PM2_NAMESPACE" --update-env
          else
            echo "  ▶️ Starting $APP_NAME..."
            sudo -u deploy NAMESPACE="$PM2_NAMESPACE" pm2 start ecosystem.config.js $PM2_ENV_FLAG --namespace "$PM2_NAMESPACE"
          fi

          # Save PM2 state
          sudo -u deploy pm2 save

          # Show PM2 status
          echo "📋 PM2 Status:"
          sudo -u deploy pm2 status --namespace "$PM2_NAMESPACE"

      # ======= HEALTH CHECK =======
      - name: Health check
        run: |
          echo "⏳ Waiting for service to start..."
          sleep 15

          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          ENV_FILE="${{ steps.setup.outputs.env_file }}"
          PM2_NAMESPACE="${{ steps.setup.outputs.pm2_namespace }}"
          APP_NAME="${{ steps.setup.outputs.app_name }}"

          # Source env file for port number
          source "$ENV_FILE"

          PORT=${PORT:-${{ steps.setup.outputs.ui_port }}}

          echo "🔍 Checking service on port $PORT..."

          if ! curl -f http://localhost:${PORT} > /dev/null 2>&1; then
            echo "⚠️ Health check failed, checking PM2 logs..."
            sudo -u deploy pm2 logs --lines 20 --nostream --namespace "$PM2_NAMESPACE" || true
            echo "⚠️ Continuing despite health check failure..."
          else
            echo "✅ UI is running on port $PORT"
          fi

          APP_STATUS=$(sudo -u deploy pm2 jlist | jq -r ".[] | select(.namespace == \"$PM2_NAMESPACE\" and .name == \"$APP_NAME\") | .pm2_env.status" | head -1)
          echo "📊 Service Status: $APP_NAME: $APP_STATUS"

      # ======= CLEANUP =======
      - name: Cleanup old backups
        if: success()
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          BACKUP_DIR="$REPO_DIR/backups"
          sudo -u deploy bash -c "ls -t $BACKUP_DIR/backup-*.tar.gz 2>/dev/null | tail -n +4 | xargs -r rm -f" || true

          LOG_DIR="${{ steps.setup.outputs.log_dir }}"
          sudo -u deploy find "$LOG_DIR" -name "*.log" -mtime +30 -delete 2>/dev/null || true

      # ======= SUCCESS NOTIFICATION =======
      - name: Teams Notification - Success
        if: success() && ${{ secrets.TEAMS_WEBHOOK_URL != '' }}
        uses: jdcargile/ms-teams-notification@v1.4
        with:
          github-token: ${{ github.token }}
          ms-teams-webhook-uri: ${{ secrets.TEAMS_WEBHOOK_URL }}
          notification-summary: "✅ LearnBot UI deployed to ${{ env.DEPLOY_ENV }}"
          notification-color: "00FF00"

      # ======= FAILURE HANDLING =======
      - name: Rollback and notify on failure
        if: failure()
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          BACKUP_DIR="$REPO_DIR/backups"
          PM2_NAMESPACE="${{ steps.setup.outputs.pm2_namespace }}"

          LATEST_BACKUP=$(ls -t $BACKUP_DIR/backup-*.tar.gz 2>/dev/null | head -1)
          if [ -n "$LATEST_BACKUP" ]; then
            echo "🔄 Rolling back to $LATEST_BACKUP"
            cd "$REPO_DIR"
            set +e
            sudo -u deploy tar -xzf "$LATEST_BACKUP" \
              -C "$REPO_DIR" \
              --exclude="qdrant_storage" \
              2>&1 | grep -vE "(Cannot open: File exists|Cannot utime: Operation not permitted|Exiting with failure status)" || true
            set -e
            echo "✅ Rollback complete"
          else
            echo "⚠️ No backup found to rollback"
          fi

          if [ -n "${{ secrets.TEAMS_WEBHOOK_URL }}" ]; then
            curl -H "Content-Type: application/json" \
                 -d '{"summary":"❌ LearnBot UI deployment failed ('${{ env.DEPLOY_ENV }}')"}' \
                 "${{ secrets.TEAMS_WEBHOOK_URL }}" || true
          fi
