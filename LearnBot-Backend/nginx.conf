# Nginx Configuration for LearnBot Backend
# Place this in /etc/nginx/sites-available/learnbot-backend
# Then symlink: sudo ln -s /etc/nginx/sites-available/learnbot-backend /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name 129.10.224.227;  # Update with your domain or IP
    
    # Backend API (PROD: 8030; for UAT use 8031)
    location /api/ {
        proxy_pass http://127.0.0.1:8030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # CORS headers (if needed)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Session-Id, X-User-Id' always;
    }
    
    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8030/health;
        proxy_set_header Host $host;
    }
}
