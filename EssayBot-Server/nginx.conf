# HTTP to HTTPS redirect
server {
    listen 80;
    server_name uat.api.essaybot.dashlab.studio;

    return 301 https://$server_name$request_uri;
}

# Main HTTPS server
server {
    listen 443 http2;
    server_name uat.api.essaybot.dashlab.studio;

    client_max_body_size 100M;
    client_body_timeout 300s;
    client_header_timeout 300s;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/uat.api.essaybot.dashlab.studio/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/uat.api.essaybot.dashlab.studio/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Main Express.js API routes
    location /api/ {
        proxy_pass http://localhost:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for API requests
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Python Flask routes (AI/ML processing)
    location ~ ^/(generate_prompt|grade_bulk_essays|grade_single_essay|generate_rubric|index|index-multiple|index-content-specifications|analyze_grading)$ {
        proxy_pass http://localhost:6001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeouts for AI processing
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Health check endpoints
    location /health {
        proxy_pass http://localhost:8002/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location /flask-health {
        proxy_pass http://localhost:6001/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Default route - redirect to API
    location / {
        return 301 /api$request_uri;
    }

    # Logging
    access_log /var/log/nginx/uat_api_access.log;
    error_log /var/log/nginx/uat_api_error.log;
} 
