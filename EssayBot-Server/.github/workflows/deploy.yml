name: Deploy EssayBot Server
on:
  push:
    branches:
      - qdrant-migration # UAT branch (matching deploy.sh)
      - release/prod # PROD branch
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "UAT"
        type: choice
        options:
          - UAT
          - PROD
      branch:
        description: "Branch to deploy (optional, defaults to env branch)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: self-hosted
    concurrency:
      group: deploy-essaybot-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || ((github.ref == 'refs/heads/release/prod' || github.ref == 'refs/heads/main') && 'PROD' || 'UAT') }}
      cancel-in-progress: false

    steps:
      # ======= SETUP ENVIRONMENT =======
      - name: Setup deployment environment
        id: setup
        run: |
          # Determine environment based on branch (matching deploy.sh logic)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            DEPLOY_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/release/prod" ] || [ "${{ github.ref }}" == "refs/heads/main" ]; then
            DEPLOY_ENV="PROD"
          else
            DEPLOY_ENV="UAT"
          fi

          # Set environment variables and paths (matching deploy.sh exactly)
          DEPLOY_ENV_LOWER=$(echo "$DEPLOY_ENV" | tr '[:upper:]' '[:lower:]')

          case "$DEPLOY_ENV" in
            PROD)
              REPO_DIR="/opt/Essaybot-server"
              PM2_NAMESPACE="prod"
              LOG_DIR="/opt/Essaybot-server/logs"
              EXPRESS_PORT=8001
              FLASK_PORT=6000
              PM2_ENV_FLAG="--env production"
              APP_EXPRESS="essaybot-express"
              APP_FLASK="essaybot-flask"
              APP_WORKER="essaybot-worker"
              DEFAULT_BRANCH="release/prod"
              ;;
            UAT)
              REPO_DIR="/opt/Essaybot-server-UAT"
              PM2_NAMESPACE="uat"
              LOG_DIR="/opt/Essaybot-server-UAT/logs"
              EXPRESS_PORT=8002
              FLASK_PORT=6001
              PM2_ENV_FLAG=""
              APP_EXPRESS="essaybot-express-uat"
              APP_FLASK="essaybot-flask-uat"
              APP_WORKER="essaybot-worker-uat"
              DEFAULT_BRANCH="qdrant-migration"
              ;;
            *)
              echo "❌ Unknown environment: $DEPLOY_ENV"
              echo "   Expected: UAT or PROD"
              exit 1
              ;;
          esac

          # Export to GitHub environment and outputs
          echo "DEPLOY_ENV=$DEPLOY_ENV" >> $GITHUB_ENV
          echo "deploy_env=$DEPLOY_ENV" >> $GITHUB_OUTPUT
          echo "deploy_env_lower=$DEPLOY_ENV_LOWER" >> $GITHUB_OUTPUT
          echo "repo_dir=$REPO_DIR" >> $GITHUB_OUTPUT
          echo "pm2_namespace=$PM2_NAMESPACE" >> $GITHUB_OUTPUT
          echo "log_dir=$LOG_DIR" >> $GITHUB_OUTPUT
          echo "express_port=$EXPRESS_PORT" >> $GITHUB_OUTPUT
          echo "flask_port=$FLASK_PORT" >> $GITHUB_OUTPUT
          echo "pm2_env_flag=$PM2_ENV_FLAG" >> $GITHUB_OUTPUT
          echo "app_express=$APP_EXPRESS" >> $GITHUB_OUTPUT
          echo "app_flask=$APP_FLASK" >> $GITHUB_OUTPUT
          echo "app_worker=$APP_WORKER" >> $GITHUB_OUTPUT
          echo "default_branch=$DEFAULT_BRANCH" >> $GITHUB_OUTPUT
          echo "env_file=$REPO_DIR/.env.$DEPLOY_ENV_LOWER" >> $GITHUB_OUTPUT

      # ======= SETUP LOG DIRECTORY =======
      - name: Setup log directory
        run: |
          LOG_DIR="${{ steps.setup.outputs.log_dir }}"
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"

          # Create log directory with proper permissions
          sudo mkdir -p "$LOG_DIR"
          sudo chown deploy:deploy "$LOG_DIR"
          sudo chmod 755 "$LOG_DIR"

          echo "✅ Log directory created: $LOG_DIR"

          # Clean up old log files (older than 30 days)
          sudo -u deploy find "$LOG_DIR" -name "*.log" -mtime +30 -delete 2>/dev/null || true
          echo "🧹 Cleaned up old log files"

      # ======= GIT CONFIG & CHECKOUT =======
      - name: Configure Git and checkout
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}

      # ======= NODE.JS SETUP =======
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          # Cache disabled - using npm install on server directly, caching not needed
          # cache: "npm"

      # ======= NOTIFICATIONS =======
      - name: Teams Notification - Starting
        uses: jdcargile/ms-teams-notification@v1.4
        with:
          github-token: ${{ github.token }}
          ms-teams-webhook-uri: ${{ secrets.TEAMS_WEBHOOK_URL }}
          notification-summary: "🚀 Deploying EssayBot Server to ${{ env.DEPLOY_ENV }}"
          notification-color: "0076D7"

      # ======= BACKUP =======
      - name: Backup current deployment
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          BACKUP_DIR="$REPO_DIR/backups"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          sudo -u deploy mkdir -p "$BACKUP_DIR"
          if [ -d "$REPO_DIR" ] && [ "$(ls -A $REPO_DIR 2>/dev/null)" ]; then
            echo "📦 Creating backup..."
            sudo -u deploy tar -czf "$BACKUP_DIR/backup-$TIMESTAMP.tar.gz" \
              -C "$REPO_DIR" \
              --exclude="node_modules" \
              --exclude="venv" \
              --exclude="*.log" \
              --exclude="cache" \
              --exclude="backups" \
              . 2>/dev/null || true
          fi

      # ======= UPDATE GIT REMOTE =======
      - name: Update Git remote with current PAT
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          cd "$REPO_DIR"
          sudo -u deploy git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/dmsb-dash-labs/EssayBot-Server
          echo "✅ Updated Git remote URL with current PAT"

      # ======= UPDATE CODE =======
      - name: Pull latest code
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          DEFAULT_BRANCH="${{ steps.setup.outputs.default_branch }}"

          # Use branch from workflow_dispatch input or default to environment branch
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.branch }}" ]; then
            DEPLOY_BRANCH="${{ github.event.inputs.branch }}"
          else
            DEPLOY_BRANCH="${{ github.ref_name }}"
            # If ref_name doesn't match expected branch, use default for environment
            if [ "$DEPLOY_BRANCH" != "$DEFAULT_BRANCH" ]; then
              DEPLOY_BRANCH="$DEFAULT_BRANCH"
            fi
          fi

          cd "$REPO_DIR"
          sudo -u deploy git fetch --all
          sudo -u deploy git checkout "$DEPLOY_BRANCH"

          # Reset to remote branch to ensure server matches repository exactly
          # This handles cases where server has local commits that diverged
          echo "🔄 Resetting to match remote branch exactly..."
          sudo -u deploy git reset --hard "origin/$DEPLOY_BRANCH"
          echo "✅ Reset to latest code from branch: $DEPLOY_BRANCH (commit: $(sudo -u deploy git rev-parse --short HEAD))"

      # ======= CREATE ENV FILE =======
      - name: Create environment file
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          cd "$REPO_DIR"

          # Determine MINIO_BUCKET with fallback logic
          # Priority: 1) Environment-specific secret, 2) Generic secret, 3) Environment-based default
          MINIO_BUCKET_ENV="${{ secrets[format('MINIO_BUCKET_{0}', env.DEPLOY_ENV)] }}"
          MINIO_BUCKET_GENERIC="${{ secrets.MINIO_BUCKET }}"

          if [ -n "$MINIO_BUCKET_ENV" ] && [ "$MINIO_BUCKET_ENV" != "" ]; then
            MINIO_BUCKET_VALUE="$MINIO_BUCKET_ENV"
            echo "✅ Using environment-specific MINIO_BUCKET from secret: $MINIO_BUCKET_VALUE"
          elif [ -n "$MINIO_BUCKET_GENERIC" ] && [ "$MINIO_BUCKET_GENERIC" != "" ]; then
            MINIO_BUCKET_VALUE="$MINIO_BUCKET_GENERIC"
            echo "✅ Using generic MINIO_BUCKET from secret: $MINIO_BUCKET_VALUE"
          else
            # Hardcoded fallback based on environment - ensures Flask always has a valid bucket name
            if [ "${{ env.DEPLOY_ENV }}" == "UAT" ]; then
              MINIO_BUCKET_VALUE="essaybot-uat"
              echo "⚠️  No MINIO_BUCKET secret found, using UAT fallback: $MINIO_BUCKET_VALUE"
            else
              MINIO_BUCKET_VALUE="essaybot"
              echo "⚠️  No MINIO_BUCKET secret found, using PROD fallback: $MINIO_BUCKET_VALUE"
            fi
          fi

          # Final validation - ensure we have a non-empty value
          if [ -z "$MINIO_BUCKET_VALUE" ]; then
            echo "❌ ERROR: MINIO_BUCKET_VALUE is empty after all checks!"
            exit 1
          fi

          # Debug: Check secret lengths before writing (to detect truncation issues)
          echo "🔍 Debugging GitHub Secrets (checking for truncation):"
          echo "  MINIO_ACCESS_KEY from secret length: $(echo -n '${{ secrets.MINIO_ACCESS_KEY }}' | wc -c)"
          echo "  MINIO_SECRET_KEY from secret length: $(echo -n '${{ secrets.MINIO_SECRET_KEY }}' | wc -c)"
          echo "  MINIO_SECRET_KEY first 4 chars: $(echo -n '${{ secrets.MINIO_SECRET_KEY }}' | cut -c1-4)***"
          echo "  MINIO_SECRET_KEY last 2 chars: ***$(echo -n '${{ secrets.MINIO_SECRET_KEY }}' | tail -c 2)"
          echo "  MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}"

          # Expected: MINIO_SECRET_KEY should be "Dash@minIO25@#" (16 characters)
          # If the secret length doesn't match, it's truncated!
          if [ $(echo -n '${{ secrets.MINIO_SECRET_KEY }}' | wc -c) -ne 16 ]; then
            echo "  ⚠️  WARNING: MINIO_SECRET_KEY secret length mismatch!"
            echo "  ⚠️  Expected 16 chars, got $(echo -n '${{ secrets.MINIO_SECRET_KEY }}' | wc -c)"
            echo "  ⚠️  The GitHub Secret might be missing trailing characters!"
          fi

          # Create .env file with all variables
          # NOTE: OLLAMA_URL and OLLAMA_MODEL_URL are the same for both environments (generic secrets)
          # ESSAYBOT_PRODUCTION_URL is the UI URL (not API) - used for authentication redirects
          # Use a temporary approach: write MINIO_BUCKET separately to ensure variable expansion works
          sudo -u deploy bash -c "cat > .env.${{ steps.setup.outputs.deploy_env_lower }} << 'ENVEOF'
          NODE_ENV=production
          NAMESPACE=${{ steps.setup.outputs.pm2_namespace }}
          PORT=${{ steps.setup.outputs.express_port }}
          FLASK_PORT=${{ steps.setup.outputs.flask_port }}
          MONGO_URI=${{ secrets[format('MONGO_URI_{0}', env.DEPLOY_ENV)] }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          EXTERNAL_JWT_SECRET=${{ secrets.EXTERNAL_JWT_SECRET }}
          RABBITMQ_URL=amqp://essaybot:essaybot123@localhost:5672
          REDIS_URL=redis://localhost:6379
          PYTHON_SERVICE_URL=http://localhost:${{ steps.setup.outputs.flask_port }}
          # MinIO variables required by Attachment.ts model (using MinIO, not AWS S3)
          # NOTE: Bucket names may be environment-specific (e.g., essaybot-uat for UAT, essaybot for PROD)
          MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
          MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }}
          MINIO_BUCKET=PLACEHOLDER_BUCKET_NAME
          # vLLM API configuration (same for both UAT and PROD - uses /v1/completions endpoint)
          # OLLAMA_URL should be the full vLLM completions endpoint (e.g., http://host:port/v1/completions)
          # OLLAMA_MODEL_URL should be the vLLM base URL without path (e.g., http://host:port)
          # NOTE: Both environments use the same vLLM server, so these are generic secrets (not environment-specific)
          OLLAMA_URL=${{ secrets.OLLAMA_URL }}
          OLLAMA_MODEL_URL=${{ secrets.OLLAMA_MODEL_URL }}
          # AI Model configuration
          VISION_MODEL=${{ secrets.VISION_MODEL }}
          EMBEDDING_MODEL=${{ secrets.EMBEDDING_MODEL }}
          # AWS configuration (for S3 compatibility, even though using MinIO)
          AWS_REGION=${{ secrets.AWS_REGION }}
          # Authentication redirect URLs (UI URLs, not API URLs)
          # ESSAYBOT_PRODUCTION_URL is used by crossDomainAuth.ts for redirects after login
          # NOTE: This should be the UI URL (essaybot.dashlab.studio), NOT the API URL (api.essaybot.dashlab.studio)
          #   UAT: https://uat.essaybot.dashlab.studio
          #   PROD: https://essaybot.dashlab.studio
          ESSAYBOT_PRODUCTION_URL=${{ secrets[format('ESSAYBOT_PRODUCTION_URL_{0}', env.DEPLOY_ENV)] }}
          DASH_PORTAL_PRODUCTION_URL=${{ secrets[format('DASH_PORTAL_PRODUCTION_URL_{0}', env.DEPLOY_ENV)] }}
          LOG_LEVEL=${{ steps.setup.outputs.pm2_namespace == 'prod' && 'info' || 'debug' }}
          ENVEOF"

          # Replace placeholder with actual bucket value (this ensures variable expansion works correctly)
          sudo -u deploy sed -i.bak "s|MINIO_BUCKET=PLACEHOLDER_BUCKET_NAME|MINIO_BUCKET=${MINIO_BUCKET_VALUE}|" .env.${{ steps.setup.outputs.deploy_env_lower }}
          sudo -u deploy rm -f .env.${{ steps.setup.outputs.deploy_env_lower }}.bak 2>/dev/null || true

          echo "✅ Environment file created: .env.${{ steps.setup.outputs.deploy_env_lower }}"
          echo "   MINIO_BUCKET=${MINIO_BUCKET_VALUE}"

          # Verify MINIO_BUCKET was written correctly
          echo "🔍 Verifying MINIO_BUCKET in .env file:"
          if sudo -u deploy grep "^MINIO_BUCKET=" .env.${{ steps.setup.outputs.deploy_env_lower }} >/dev/null 2>&1; then
            sudo -u deploy grep "^MINIO_BUCKET=" .env.${{ steps.setup.outputs.deploy_env_lower }}
            BUCKET_VALUE=$(sudo -u deploy grep "^MINIO_BUCKET=" .env.${{ steps.setup.outputs.deploy_env_lower }} | cut -d'=' -f2)
            if [ -z "$BUCKET_VALUE" ]; then
              echo "❌ ERROR: MINIO_BUCKET is empty in .env file!"
              echo "   Expected: essaybot-uat or essaybot"
              exit 1
            else
              echo "✅ MINIO_BUCKET value: $BUCKET_VALUE"
            fi
          else
            echo "❌ MINIO_BUCKET not found in .env file!"
            exit 1
          fi

      # ======= SECURITY AUDIT =======
      - name: Run npm audit (security check)
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          cd "$REPO_DIR"

          echo "🔒 Running npm audit for security vulnerabilities..."
          sudo -u deploy npm audit --audit-level=moderate || true

          # Check for critical/high vulnerabilities and fail if found
          AUDIT_OUTPUT=$(sudo -u deploy npm audit --audit-level=moderate --json 2>/dev/null || echo '{}')
          CRITICAL=$(echo "$AUDIT_OUTPUT" | jq -r '.metadata.vulnerabilities.critical // 0')
          HIGH=$(echo "$AUDIT_OUTPUT" | jq -r '.metadata.vulnerabilities.high // 0')

          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "❌ CRITICAL or HIGH severity vulnerabilities found!"
            echo "   Critical: $CRITICAL"
            echo "   High: $HIGH"
            echo "   Please run 'npm audit fix' or update vulnerable packages before deploying."
            exit 1
          fi
          echo "✅ npm audit passed - no critical or high severity vulnerabilities"

      # ======= INSTALL DEPENDENCIES =======
      - name: Install Node.js dependencies
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          ENV_FILE="${{ steps.setup.outputs.env_file }}"

          echo "📦 Installing Node.js dependencies..."
          cd "$REPO_DIR"
          # DO NOT overwrite .env here - preserve existing working .env from manual deployment
          # The .env file will be handled in the "Restart PM2 services" step with proper preservation logic
          sudo -u deploy npm ci || sudo -u deploy npm install
          echo "✅ Node.js dependencies installed"

      # ======= SETUP PYTHON ENVIRONMENT =======
      - name: Setup Python virtual environment
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          ENV_FILE="${{ steps.setup.outputs.env_file }}"

          echo "🐍 Setting up Python virtual environment..."
          cd "$REPO_DIR/src/python"

          if [ ! -d "venv" ]; then
            sudo -u deploy python3 -m venv venv
          fi

          sudo -u deploy bash -c "source venv/bin/activate && \
            pip3 install --upgrade pip && \
            pip3 install pip-audit && \
            pip3 install -r requirements.txt"
          echo "✅ Python dependencies installed"

      # ======= PYTHON SECURITY AUDIT =======
      - name: Run pip-audit (security check)
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          cd "$REPO_DIR/src/python"

          echo "🔒 Running pip-audit for security vulnerabilities..."
          sudo -u deploy bash -c "source venv/bin/activate && \
            pip-audit --desc" || true

          # Check for critical/high vulnerabilities
          AUDIT_OUTPUT=$(sudo -u deploy bash -c "source venv/bin/activate && \
            pip-audit --format json --desc" 2>/dev/null || echo '{"vulnerabilities":[]}')

          # Count critical and high severity vulnerabilities
          CRITICAL=$(echo "$AUDIT_OUTPUT" | jq -r '[.vulnerabilities[] | select(.severity == "CRITICAL" or (.aliases[]? | test("CRITICAL"; "i")))] | length // 0')
          HIGH=$(echo "$AUDIT_OUTPUT" | jq -r '[.vulnerabilities[] | select(.severity == "HIGH" or (.aliases[]? | test("HIGH"; "i")))] | length // 0')

          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "❌ CRITICAL or HIGH severity vulnerabilities found!"
            echo "   Critical: $CRITICAL"
            echo "   High: $HIGH"
            echo "   Please update vulnerable packages in requirements.txt before deploying."
            exit 1
          fi
          echo "✅ pip-audit passed - no critical or high severity vulnerabilities"

      # ======= PREPARE DOCKER DIRECTORIES =======
      - name: Ensure Docker storage directories exist
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          STORAGE_DIR="$REPO_DIR/storage/qdrant"

          echo "📁 Ensuring Qdrant storage directory exists at $STORAGE_DIR"
          sudo mkdir -p "$STORAGE_DIR"
          sudo chown deploy:deploy "$REPO_DIR/storage" "$STORAGE_DIR" || true
          sudo chmod 755 "$REPO_DIR/storage" "$STORAGE_DIR"
          echo "✅ Storage directory ready"

      # ======= START DOCKER SERVICES =======
      - name: Start Docker Compose services (RabbitMQ, Redis)
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          cd "$REPO_DIR"

          echo "🐳 Starting Docker Compose services..."
          if [ -f "docker-compose.yml" ]; then
            # Stop and remove existing containers by name to avoid conflicts
            # Use direct docker commands to handle containers created with or without sudo
            echo "🧹 Cleaning up existing containers..."
            sudo docker stop essaybot-rabbitmq essaybot-redis 2>/dev/null || docker stop essaybot-rabbitmq essaybot-redis 2>/dev/null || true
            sudo docker rm -f essaybot-rabbitmq essaybot-redis 2>/dev/null || docker rm -f essaybot-rabbitmq essaybot-redis 2>/dev/null || true
            
            # Try Docker Compose V2 first, fallback to V1
            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              if docker compose up -d rabbitmq redis 2>/dev/null; then
                echo "✅ RabbitMQ and Redis started (Docker Compose V2)"
              else
                echo "⚠️ Docker permission denied, trying with sudo..."
                sudo docker compose up -d rabbitmq redis
                echo "✅ RabbitMQ and Redis started (Docker Compose V2 with sudo)"
              fi
            elif command -v docker-compose >/dev/null 2>&1; then
              if docker-compose up -d rabbitmq redis 2>/dev/null; then
                echo "✅ RabbitMQ and Redis started (Docker Compose V1)"
              else
                echo "⚠️ Docker permission denied, trying with sudo..."
                sudo docker-compose up -d rabbitmq redis
                echo "✅ RabbitMQ and Redis started (Docker Compose V1 with sudo)"
              fi
            else
              echo "⚠️ Docker Compose not found, skipping Docker services"
            fi
          else
            echo "⚠️ docker-compose.yml not found, skipping Docker services"
          fi

      # ======= RESTART PM2 SERVICES =======
      - name: Restart PM2 services (zero downtime)
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          ENV_FILE="${{ steps.setup.outputs.env_file }}"
          PM2_NAMESPACE="${{ steps.setup.outputs.pm2_namespace }}"
          APP_EXPRESS="${{ steps.setup.outputs.app_express }}"
          APP_FLASK="${{ steps.setup.outputs.app_flask }}"
          APP_WORKER="${{ steps.setup.outputs.app_worker }}"
          PM2_ENV_FLAG="${{ steps.setup.outputs.pm2_env_flag }}"

          cd "$REPO_DIR"

          # Check if .env already exists (from manual deployment)
          # If it exists and was working, preserve it to avoid breaking what wasn't broken
          if [ -f .env ] && sudo -u deploy test -r .env; then
            echo "⚠️  Existing .env file found - checking if it should be preserved..."
            
            # Check if existing .env has MinIO credentials
            if sudo -u deploy grep -q "^MINIO_ACCESS_KEY=" .env && \
               sudo -u deploy grep -q "^MINIO_SECRET_KEY=" .env && \
               sudo -u deploy grep -q "^MINIO_ENDPOINT=" .env; then
              
              # Extract and verify existing MinIO credentials
              EXISTING_SECRET_KEY=$(sudo -u deploy grep "^MINIO_SECRET_KEY=" .env | cut -d'=' -f2 | tr -d '"' | tr -d "'")
              EXISTING_SECRET_LENGTH=${#EXISTING_SECRET_KEY}
              
              echo "  ✅ Existing .env has MinIO credentials - preserving it"
              echo "  🔍 Existing MINIO_SECRET_KEY length: $EXISTING_SECRET_LENGTH (expected: 16)"
              echo "  🔍 Existing MINIO_SECRET_KEY first 4 chars: ${EXISTING_SECRET_KEY:0:4}***"
              echo "  🔍 Existing MINIO_SECRET_KEY last 2 chars: ***${EXISTING_SECRET_KEY: -2}"
              
              # Compare with GitHub secret length (without revealing actual values)
              GITHUB_SECRET_LENGTH=$(echo -n '${{ secrets.MINIO_SECRET_KEY }}' | wc -c)
              echo "  🔍 GitHub Secret MINIO_SECRET_KEY length: $GITHUB_SECRET_LENGTH"
              
              if [ "$EXISTING_SECRET_LENGTH" -ne 16 ] || [ "$GITHUB_SECRET_LENGTH" -ne 16 ]; then
                echo "  ⚠️  WARNING: Length mismatch detected!"
                echo "  ⚠️  Existing: $EXISTING_SECRET_LENGTH chars, GitHub Secret: $GITHUB_SECRET_LENGTH chars, Expected: 16"
                echo "  ⚠️  This indicates truncation - keeping existing .env to preserve working credentials"
              fi
              
              echo "  📋 Backing up existing .env to .env.backup.$(date +%Y%m%d_%H%M%S)"
              sudo -u deploy cp .env .env.backup.$(date +%Y%m%d_%H%M%S)
              
              # Check and add EXTERNAL_JWT_SECRET if missing (required for DashPortal authentication)
              if ! sudo -u deploy grep -q "^EXTERNAL_JWT_SECRET=" .env; then
                echo "  ⚠️  EXTERNAL_JWT_SECRET missing from existing .env - adding it..."
                sudo -u deploy bash -c "echo 'EXTERNAL_JWT_SECRET=${{ secrets.EXTERNAL_JWT_SECRET }}' >> .env"
                echo "  ✅ Added EXTERNAL_JWT_SECRET to existing .env file"
                
                # Verify it was added correctly
                if sudo -u deploy grep -q "^EXTERNAL_JWT_SECRET=" .env; then
                  EXTERNAL_SECRET_LENGTH=$(echo -n '${{ secrets.EXTERNAL_JWT_SECRET }}' | wc -c)
                  echo "  🔍 EXTERNAL_JWT_SECRET length: $EXTERNAL_SECRET_LENGTH (expected: 15 for 'dash_Portal12@#')"
                  if [ "$EXTERNAL_SECRET_LENGTH" -ne 15 ]; then
                    echo "  ⚠️  WARNING: EXTERNAL_JWT_SECRET length is $EXTERNAL_SECRET_LENGTH, expected 15!"
                    echo "  ⚠️  GitHub secret might be truncated. Check if it ends with '@#'"
                  fi
                else
                  echo "  ❌ ERROR: Failed to add EXTERNAL_JWT_SECRET to .env file!"
                  exit 1
                fi
              else
                echo "  ✅ EXTERNAL_JWT_SECRET already exists in .env file"
                # Verify the existing value length
                EXISTING_EXTERNAL_SECRET=$(sudo -u deploy grep "^EXTERNAL_JWT_SECRET=" .env | cut -d'=' -f2 | tr -d '"' | tr -d "'")
                EXISTING_EXTERNAL_LENGTH=${#EXISTING_EXTERNAL_SECRET}
                echo "  🔍 Existing EXTERNAL_JWT_SECRET length: $EXISTING_EXTERNAL_LENGTH (expected: 15)"
                if [ "$EXISTING_EXTERNAL_LENGTH" -ne 15 ]; then
                  echo "  ⚠️  WARNING: Existing EXTERNAL_JWT_SECRET length is $EXISTING_EXTERNAL_LENGTH, expected 15!"
                  echo "  ⚠️  Updating with value from GitHub secret..."
                  # Remove old line and add new one
                  sudo -u deploy sed -i.bak '/^EXTERNAL_JWT_SECRET=/d' .env
                  sudo -u deploy rm -f .env.bak 2>/dev/null || true
                  sudo -u deploy bash -c "echo 'EXTERNAL_JWT_SECRET=${{ secrets.EXTERNAL_JWT_SECRET }}' >> .env"
                  echo "  ✅ Updated EXTERNAL_JWT_SECRET in .env file"
                fi
              fi
              
              # Always update OLLAMA_URL and OLLAMA_MODEL_URL from GitHub secrets (critical for vLLM connectivity)
              echo "  🔄 Updating OLLAMA_URL and OLLAMA_MODEL_URL from GitHub secrets..."
              # Remove old lines if they exist (handles both quoted and unquoted values)
              sudo -u deploy sed -i.bak '/^OLLAMA_URL=/d' .env
              sudo -u deploy sed -i.bak '/^OLLAMA_MODEL_URL=/d' .env
              sudo -u deploy rm -f .env.bak 2>/dev/null || true
              # Add updated values (without quotes to avoid parsing issues)
              sudo -u deploy bash -c "echo 'OLLAMA_URL=${{ secrets.OLLAMA_URL }}' >> .env"
              sudo -u deploy bash -c "echo 'OLLAMA_MODEL_URL=${{ secrets.OLLAMA_MODEL_URL }}' >> .env"
              echo "  ✅ Updated OLLAMA_URL and OLLAMA_MODEL_URL in .env file"
              # Verify the update
              echo "  🔍 Verifying updated values:"
              sudo -u deploy grep "^OLLAMA_URL=" .env | head -1 | sed 's/\(.\{50\}\).*/\1.../' || echo "    ⚠️  OLLAMA_URL not found"
              sudo -u deploy grep "^OLLAMA_MODEL_URL=" .env | head -1 | sed 's/\(.\{50\}\).*/\1.../' || echo "    ⚠️  OLLAMA_MODEL_URL not found"
              
              echo "  ℹ️  Keeping existing .env (what was working manually)"
              echo "  ℹ️  If you want to update .env, delete it first or manually edit it"
            else
              echo "  ⚠️  Existing .env missing MinIO credentials - will use new .env"
              echo "📋 Copying environment file..."
              sudo -u deploy cp "$ENV_FILE" .env
              sudo -u deploy chmod 644 .env
            fi
          else
            echo "📋 Copying environment file..."
            sudo -u deploy cp "$ENV_FILE" .env
            sudo -u deploy chmod 644 .env
          fi

          # Verify .env file is readable and in the correct location
          if [ ! -f .env ]; then
            echo "❌ ERROR: .env file not found at $(pwd)/.env"
            exit 1
          fi
          if [ ! -r .env ]; then
            echo "❌ ERROR: .env file is not readable at $(pwd)/.env"
            exit 1
          fi
          echo "✅ .env file is ready at: $(pwd)/.env"

          # Final verification: Ensure EXTERNAL_JWT_SECRET is present (required for DashPortal authentication)
          echo "🔍 Verifying EXTERNAL_JWT_SECRET in .env file..."
          if ! sudo -u deploy grep -q "^EXTERNAL_JWT_SECRET=" .env; then
            echo "  ⚠️  EXTERNAL_JWT_SECRET missing from .env - adding it from GitHub secret..."
            sudo -u deploy bash -c "echo 'EXTERNAL_JWT_SECRET=${{ secrets.EXTERNAL_JWT_SECRET }}' >> .env"
            echo "  ✅ Added EXTERNAL_JWT_SECRET to .env file"
          fi

          # Verify EXTERNAL_JWT_SECRET value
          if sudo -u deploy grep -q "^EXTERNAL_JWT_SECRET=" .env; then
            EXTERNAL_SECRET_VALUE=$(sudo -u deploy grep "^EXTERNAL_JWT_SECRET=" .env | cut -d'=' -f2 | tr -d '"' | tr -d "'")
            EXTERNAL_SECRET_LENGTH=${#EXTERNAL_SECRET_VALUE}
            echo "  ✅ EXTERNAL_JWT_SECRET found in .env file (length: $EXTERNAL_SECRET_LENGTH)"
            if [ "$EXTERNAL_SECRET_LENGTH" -ne 15 ]; then
              echo "  ⚠️  WARNING: EXTERNAL_JWT_SECRET length is $EXTERNAL_SECRET_LENGTH, expected 15!"
              echo "  ⚠️  Expected: 'dash_Portal12@#' (15 chars)"
              echo "  ⚠️  GitHub secret might be truncated. Check if it ends with '@#'"
            else
              echo "  ✅ EXTERNAL_JWT_SECRET length is correct (15 characters)"
            fi
          else
            echo "  ❌ ERROR: EXTERNAL_JWT_SECRET verification failed!"
            exit 1
          fi

          # Flush old PM2 logs before restart
          echo "🧹 Flushing PM2 logs..."
          sudo -u deploy pm2 flush

          # Express - delete and start fresh to ensure env vars are reloaded from .env file
          # This ensures FileUploadService and S3Client are initialized with correct env vars
          echo "🔄 Managing Express service..."

          # Verify .env file exists and has all required MINIO variables
          echo "  🔍 Verifying .env file for Express..."
          if sudo -u deploy test -f .env; then
            echo "    ✅ .env file exists at: $(pwd)/.env"
            echo "    📋 MINIO variables in .env:"
            sudo -u deploy grep "^MINIO_" .env | sed 's/^/      /' || echo "      ⚠️  No MINIO variables found"
            
            # Verify all required variables are present and non-empty
            MINIO_ACCESS_KEY=$(sudo -u deploy grep "^MINIO_ACCESS_KEY=" .env | cut -d'=' -f2 | tr -d '"' | tr -d "'")
            MINIO_SECRET_KEY=$(sudo -u deploy grep "^MINIO_SECRET_KEY=" .env | cut -d'=' -f2 | tr -d '"' | tr -d "'")
            MINIO_ENDPOINT=$(sudo -u deploy grep "^MINIO_ENDPOINT=" .env | cut -d'=' -f2 | tr -d '"' | tr -d "'")
            MINIO_BUCKET=$(sudo -u deploy grep "^MINIO_BUCKET=" .env | cut -d'=' -f2 | tr -d '"' | tr -d "'")
            
            if [ -z "$MINIO_ACCESS_KEY" ] || [ -z "$MINIO_SECRET_KEY" ] || [ -z "$MINIO_ENDPOINT" ] || [ -z "$MINIO_BUCKET" ]; then
              echo "    ❌ ERROR: One or more MINIO variables are empty!"
              echo "      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:+SET (length: ${#MINIO_ACCESS_KEY})}${MINIO_ACCESS_KEY:-EMPTY}"
              echo "      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:+SET (length: ${#MINIO_SECRET_KEY})}${MINIO_SECRET_KEY:-EMPTY}"
              echo "      MINIO_ENDPOINT: ${MINIO_ENDPOINT:+SET}${MINIO_ENDPOINT:-EMPTY}"
              echo "      MINIO_BUCKET: ${MINIO_BUCKET:+SET}${MINIO_BUCKET:-EMPTY}"
              exit 1
            else
              echo "    ✅ All MINIO variables are set"
              echo "    🔍 Debugging MINIO credential lengths (to detect truncation):"
              echo "      MINIO_ACCESS_KEY length: ${#MINIO_ACCESS_KEY} (first 4 chars: ${MINIO_ACCESS_KEY:0:4}***)"
              echo "      MINIO_SECRET_KEY length: ${#MINIO_SECRET_KEY} (first 4 chars: ${MINIO_SECRET_KEY:0:4}***, last 2 chars: ***${MINIO_SECRET_KEY: -2})"
              echo "      MINIO_ENDPOINT: $MINIO_ENDPOINT"
              echo "      MINIO_BUCKET: $MINIO_BUCKET"
              
              # Expected values based on user's .env file
              # MINIO_SECRET_KEY should be "Dash@minIO25@#" (length 16)
              # Check if secret key length matches expected
              if [ "${#MINIO_SECRET_KEY}" -ne 16 ]; then
                echo "    ⚠️  WARNING: MINIO_SECRET_KEY length is ${#MINIO_SECRET_KEY}, expected 16!"
                echo "    ⚠️  This might indicate truncation of special characters (@ or #)"
              fi
              
              # Check if secret ends with @# (as it should based on user's .env)
              if [[ ! "$MINIO_SECRET_KEY" =~ @#$ ]]; then
                echo "    ⚠️  WARNING: MINIO_SECRET_KEY does not end with '@#'"
                echo "    ⚠️  This suggests the secret might be truncated!"
              fi
            fi
          else
            echo "    ❌ .env file not found at: $(pwd)/.env"
            exit 1
          fi

          # Completely delete all instances to ensure fresh start with new env vars
          # Express runs in cluster mode with 4 instances, so we need to wait for all to terminate
          if sudo -u deploy pm2 describe "$APP_EXPRESS" >/dev/null 2>&1; then
            echo "  🗑️  Force deleting all $APP_EXPRESS instances to ensure fresh start..."
            sudo -u deploy pm2 delete "$APP_EXPRESS" --namespace "$PM2_NAMESPACE" --force || true
            # Wait longer for cluster mode instances to fully terminate
            # In cluster mode with 4 instances, we need more time for all processes to fully shut down
            sleep 10
          fi

          # Check and kill any processes still holding the port (safety check)
          EXPRESS_PORT="${{ steps.setup.outputs.express_port }}"
          echo "  🔍 Checking if port $EXPRESS_PORT is free..."

          # Check multiple times with increasing delays to ensure port is truly free
          for i in 1 2 3; do
            PORT_IN_USE=$(sudo -u deploy lsof -ti:$EXPRESS_PORT 2>/dev/null || echo "")
            if [ -n "$PORT_IN_USE" ]; then
              echo "  ⚠️  Attempt $i/3: Port $EXPRESS_PORT is still in use by PID(s): $PORT_IN_USE"
              echo "  🔪 Killing processes holding port $EXPRESS_PORT..."
              sudo kill -9 $PORT_IN_USE 2>/dev/null || true
              sleep $((i * 2))  # 2s, 4s, 6s delays
            else
              echo "  ✅ Port $EXPRESS_PORT is free (checked on attempt $i)"
              break
            fi
          done

          # Final check
          PORT_IN_USE=$(sudo -u deploy lsof -ti:$EXPRESS_PORT 2>/dev/null || echo "")
          if [ -n "$PORT_IN_USE" ]; then
            echo "  ⚠️  WARNING: Port $EXPRESS_PORT may still be in use, but proceeding anyway..."
            echo "  ⚠️  The server will retry with exponential backoff if port binding fails"
          fi

          echo "  ▶️ Starting $APP_EXPRESS with fresh environment from .env file..."
          sudo -u deploy NAMESPACE="$PM2_NAMESPACE" pm2 start ecosystem.config.js $PM2_ENV_FLAG --only "$APP_EXPRESS" --namespace "$PM2_NAMESPACE"

          # Wait for Express to start, then verify env vars
          sleep 3
          echo "  🔍 Verifying Express environment variables (from PM2)..."
          PM2_ENV_OUTPUT=$(sudo -u deploy pm2 env "$APP_EXPRESS" --namespace "$PM2_NAMESPACE" 2>/dev/null || echo "")
          if echo "$PM2_ENV_OUTPUT" | grep -q "MINIO_ACCESS_KEY"; then
            echo "    ✅ MINIO_ACCESS_KEY is in PM2 environment"
          else
            echo "    ⚠️  MINIO_ACCESS_KEY NOT found in PM2 environment!"
          fi
          if echo "$PM2_ENV_OUTPUT" | grep -q "MINIO_BUCKET"; then
            echo "    ✅ MINIO_BUCKET is in PM2 environment"
            echo "$PM2_ENV_OUTPUT" | grep "MINIO_BUCKET" | sed 's/^/      /'
          else
            echo "    ⚠️  MINIO_BUCKET NOT found in PM2 environment!"
          fi
          if echo "$PM2_ENV_OUTPUT" | grep -q "EXTERNAL_JWT_SECRET"; then
            echo "    ✅ EXTERNAL_JWT_SECRET is in PM2 environment"
            # Check length without exposing the value
            EXTERNAL_SECRET_IN_PM2=$(echo "$PM2_ENV_OUTPUT" | grep "EXTERNAL_JWT_SECRET" | head -1)
            if echo "$EXTERNAL_SECRET_IN_PM2" | grep -q "length=15\|dash_Portal"; then
              echo "    ✅ EXTERNAL_JWT_SECRET appears to be correct"
            else
              echo "    ⚠️  EXTERNAL_JWT_SECRET found but value may be incorrect"
            fi
          else
            echo "    ❌ EXTERNAL_JWT_SECRET NOT found in PM2 environment!"
            echo "    ⚠️  This will cause JWT signature verification failures!"
          fi

          # Flask - delete and start fresh to ensure env vars are reloaded from .env file
          echo "🔄 Managing Flask service..."

          # Verify .env file exists and has MINIO_BUCKET before starting
          echo "  🔍 Verifying .env file..."
          if sudo -u deploy test -f .env; then
            echo "    ✅ .env file exists"
            MINIO_BUCKET=$(sudo -u deploy grep "^MINIO_BUCKET=" .env | cut -d'=' -f2 | tr -d '"' | tr -d "'")
            if [ -z "$MINIO_BUCKET" ]; then
              echo "    ❌ MINIO_BUCKET is empty in .env file!"
              exit 1
            else
              echo "    ✅ MINIO_BUCKET: $MINIO_BUCKET"
            fi
          else
            echo "    ❌ .env file not found!"
            exit 1
          fi

          # Clear Python cache to ensure fresh bytecode is generated (fixes stale .pyc files)
          echo "  🧹 Clearing Python cache to ensure fresh bytecode..."
          cd "$REPO_DIR/src/python"
          sudo -u deploy find . -type d -name "__pycache__" -exec rm -r {} + 2>/dev/null || true
          sudo -u deploy find . -name "*.pyc" -delete 2>/dev/null || true
          sudo -u deploy find . -name "*.pyo" -delete 2>/dev/null || true
          cd "$REPO_DIR"  # Return to repo root
          echo "    ✅ Python cache cleared"

          # Completely delete the process to ensure fresh start with new env vars
          if sudo -u deploy pm2 describe "$APP_FLASK" >/dev/null 2>&1; then
            echo "  🗑️  Force deleting $APP_FLASK to ensure fresh start..."
            sudo -u deploy pm2 delete "$APP_FLASK" --namespace "$PM2_NAMESPACE" --force || true
            sleep 2
          fi

          # Check and kill any processes still holding the Flask port
          FLASK_PORT="${{ steps.setup.outputs.flask_port }}"
          PORT_IN_USE=$(sudo -u deploy lsof -ti:$FLASK_PORT 2>/dev/null || echo "")
          if [ -n "$PORT_IN_USE" ]; then
            echo "  ⚠️  Flask port $FLASK_PORT is still in use, killing process..."
            sudo kill -9 $PORT_IN_USE 2>/dev/null || true
            sleep 1
          fi

          echo "  ▶️ Starting $APP_FLASK with fresh environment from .env file..."
          sudo -u deploy NAMESPACE="$PM2_NAMESPACE" pm2 start ecosystem.config.js $PM2_ENV_FLAG --only "$APP_FLASK" --namespace "$PM2_NAMESPACE"

          # Wait for Flask to start, then check if it can see MINIO_BUCKET
          sleep 3
          echo "  🔍 Checking Flask environment (from PM2)..."
          PM2_ENV_OUTPUT=$(sudo -u deploy pm2 env "$APP_FLASK" --namespace "$PM2_NAMESPACE" 2>/dev/null || echo "")
          if echo "$PM2_ENV_OUTPUT" | grep -q "MINIO_BUCKET"; then
            echo "    ✅ MINIO_BUCKET is in PM2 environment"
            echo "$PM2_ENV_OUTPUT" | grep "MINIO_BUCKET" | sed 's/^/      /'
          else
            echo "    ⚠️  MINIO_BUCKET NOT found in PM2 environment!"
          fi

          # Worker - delete and start fresh to ensure env vars are reloaded from .env file
          # Worker runs 6 instances in fork mode, so we need to delete all
          echo "🔄 Managing Worker service..."
          if sudo -u deploy pm2 describe "$APP_WORKER" >/dev/null 2>&1; then
            echo "  🗑️  Force deleting all $APP_WORKER instances to ensure fresh start..."
            sudo -u deploy pm2 delete "$APP_WORKER" --namespace "$PM2_NAMESPACE" --force || true
            sleep 3
          fi
          echo "  ▶️ Starting $APP_WORKER with fresh environment from .env file..."
          sudo -u deploy NAMESPACE="$PM2_NAMESPACE" pm2 start ecosystem.config.js $PM2_ENV_FLAG --only "$APP_WORKER" --namespace "$PM2_NAMESPACE"

          # Save PM2 state
          sudo -u deploy pm2 save

          # Show PM2 status for debugging
          echo "📋 PM2 Status:"
          sudo -u deploy pm2 status --namespace "$PM2_NAMESPACE"

          # Verify log files are being created
          echo "📝 Log files:"
          ls -la "${{ steps.setup.outputs.log_dir }}/" 2>/dev/null | head -10 || echo "Log directory not yet created"

      # ======= HEALTH CHECK =======
      - name: Health check
        run: |
          # Wait for services to start
          echo "⏳ Waiting for services to start..."
          sleep 20

          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          ENV_FILE="${{ steps.setup.outputs.env_file }}"
          PM2_NAMESPACE="${{ steps.setup.outputs.pm2_namespace }}"

          # Source env file for port numbers
          source "$ENV_FILE"

          EXPRESS_PORT="${{ steps.setup.outputs.express_port }}"
          FLASK_PORT="${{ steps.setup.outputs.flask_port }}"

          echo "🔍 Checking services..."
          echo "Express port: $EXPRESS_PORT"
          echo "Flask port: $FLASK_PORT"

          # Check Express API
          if ! curl -f http://localhost:${EXPRESS_PORT}/health 2>/dev/null; then
            echo "⚠️ Express health check failed, checking PM2 logs..."
            sudo -u deploy pm2 logs --lines 20 --nostream --namespace "$PM2_NAMESPACE" || true
            echo "⚠️ Continuing despite health check failure..."
          else
            echo "✅ Express API is running on port $EXPRESS_PORT"
          fi

          # Check Flask API
          if ! curl -f http://localhost:${FLASK_PORT}/health 2>/dev/null; then
            echo "⚠️ Flask health check failed, checking PM2 logs..."
            sudo -u deploy pm2 logs --lines 20 --nostream --namespace "$PM2_NAMESPACE" || true
            echo "⚠️ Continuing despite health check failure..."
          else
            echo "✅ Flask API is running on port $FLASK_PORT"
          fi

          # Verify PM2 services are running
          EXPRESS_STATUS=$(sudo -u deploy pm2 jlist | jq -r ".[] | select(.namespace == \"$PM2_NAMESPACE\" and (.name | contains(\"express\"))) | .pm2_env.status" | head -1)
          FLASK_STATUS=$(sudo -u deploy pm2 jlist | jq -r ".[] | select(.namespace == \"$PM2_NAMESPACE\" and (.name | contains(\"flask\"))) | .pm2_env.status" | head -1)
          WORKER_COUNT=$(sudo -u deploy pm2 jlist | jq -r ".[] | select(.namespace == \"$PM2_NAMESPACE\" and (.name | contains(\"worker\"))) | .pm2_env.status" | wc -l)

          echo "📊 Service Status:"
          echo "  Express: $EXPRESS_STATUS"
          echo "  Flask: $FLASK_STATUS"
          echo "  Workers: $WORKER_COUNT running"

      # ======= CLEANUP =======
      - name: Cleanup old backups
        if: success()
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          BACKUP_DIR="$REPO_DIR/backups"
          # Keep only 3 most recent backups
          sudo -u deploy bash -c "ls -t $BACKUP_DIR/backup-*.tar.gz 2>/dev/null | tail -n +4 | xargs -r rm -f" || true

          # Cleanup old log files (older than 30 days)
          LOG_DIR="${{ steps.setup.outputs.log_dir }}"
          sudo -u deploy find "$LOG_DIR" -name "*.log" -mtime +30 -delete 2>/dev/null || true

      # ======= SUCCESS NOTIFICATION =======
      - name: Teams Notification - Success
        if: success()
        uses: jdcargile/ms-teams-notification@v1.4
        with:
          github-token: ${{ github.token }}
          ms-teams-webhook-uri: ${{ secrets.TEAMS_WEBHOOK_URL }}
          notification-summary: "✅ EssayBot Server deployed to ${{ env.DEPLOY_ENV }}"
          notification-color: "00FF00"

      # ======= FAILURE HANDLING =======
      - name: Rollback and notify on failure
        if: failure()
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          BACKUP_DIR="$REPO_DIR/backups"
          PM2_NAMESPACE="${{ steps.setup.outputs.pm2_namespace }}"

          # Find and restore latest backup
          LATEST_BACKUP=$(ls -t $BACKUP_DIR/backup-*.tar.gz 2>/dev/null | head -1)
          if [ -n "$LATEST_BACKUP" ]; then
            echo "🔄 Rolling back to $LATEST_BACKUP"
            cd "$REPO_DIR"
            # Ignore timestamp errors (not critical - files still extract correctly)
            sudo -u deploy tar -xzf "$LATEST_BACKUP" -C "$REPO_DIR" 2>&1 | grep -v "Cannot utime" || true
            echo "✅ Rollback complete"
          else
            echo "⚠️ No backup found to rollback"
          fi

          # Send failure notification
          curl -H "Content-Type: application/json" \
               -d '{"summary":"❌ EssayBot Server deployment failed ('${{ env.DEPLOY_ENV }}')"}' \
               "${{ secrets.TEAMS_WEBHOOK_URL }}" || true
