# LearnBOT Nginx config with HTTPS (SSL)
# Copy this to the server: /etc/nginx/sites-available/learnbot
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# Cert paths (from certbot DNS challenge):
#   learnbot.dashlab.studio  -> /etc/letsencrypt/live/learnbot.dashlab.studio/
#   api.learnbot.dashlab.studio -> /etc/letsencrypt/live/api.learnbot.dashlab.studio/

# ========== LearnBOT Frontend (PROD) ==========
server {
    listen 80;
    server_name learnbot.dashlab.studio;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name learnbot.dashlab.studio;

    ssl_certificate     /etc/letsencrypt/live/learnbot.dashlab.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learnbot.dashlab.studio/privkey.pem;

    location / {
        proxy_pass http://localhost:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ========== LearnBOT Backend API (PROD) ==========
server {
    listen 80;
    server_name api.learnbot.dashlab.studio;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name api.learnbot.dashlab.studio;

    ssl_certificate     /etc/letsencrypt/live/api.learnbot.dashlab.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.learnbot.dashlab.studio/privkey.pem;

    location / {
        proxy_pass http://localhost:8030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
