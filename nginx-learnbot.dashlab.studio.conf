# LearnBOT Frontend (PROD) – HTTPS
# On server: sudo nano /etc/nginx/sites-available/learnbot.dashlab.studio
# Enable:    sudo ln -sf /etc/nginx/sites-available/learnbot.dashlab.studio /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name learnbot.dashlab.studio;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name learnbot.dashlab.studio;

    ssl_certificate     /etc/letsencrypt/live/learnbot.dashlab.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learnbot.dashlab.studio/privkey.pem;

    location / {
        proxy_pass http://localhost:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
