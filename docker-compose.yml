# Local development infrastructure for the LearnBOT monorepo.
# Starts everything Frontend/ and Backend/ need; the apps themselves run on the host
# (see `npm run dev` in the root package.json).
#
#   Postgres  localhost:5433   (user/pass/db: learnbot / learnbot_local / learnbot)
#   Qdrant    localhost:6333   (dashboard: http://localhost:6333/dashboard)
#   Redis     localhost:6379
#   RabbitMQ  localhost:5672   (management UI: http://localhost:15672, learnbot / learnbot123)
#
# Ports bind to 127.0.0.1 only. These credentials are for local dev, never production.

name: learnbot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: learnbot
      POSTGRES_PASSWORD: learnbot_local
      POSTGRES_DB: learnbot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on first start with an empty volume (`npm run infra:reset` to re-run)
      - ./Frontend/init-schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
      - ./scripts/db/02-local-extras.sql:/docker-entrypoint-initdb.d/02-local-extras.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnbot -d learnbot"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.16.2
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    # No healthcheck: the qdrant image ships without curl/wget

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.12-management
    environment:
      RABBITMQ_DEFAULT_USER: learnbot
      RABBITMQ_DEFAULT_PASS: learnbot123
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

volumes:
  postgres-data:
  qdrant-data:
  rabbitmq-data:
