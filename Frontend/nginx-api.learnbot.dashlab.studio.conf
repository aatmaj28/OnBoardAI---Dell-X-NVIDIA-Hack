# LearnBOT Backend API (PROD) – HTTPS
# On server: sudo nano /etc/nginx/sites-available/api.learnbot.dashlab.studio
# Enable:    sudo ln -sf /etc/nginx/sites-available/api.learnbot.dashlab.studio /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name api.learnbot.dashlab.studio;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name api.learnbot.dashlab.studio;

    ssl_certificate     /etc/letsencrypt/live/api.learnbot.dashlab.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.learnbot.dashlab.studio/privkey.pem;

    location / {
        proxy_pass http://localhost:8030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Required for SSE/streaming: prevent buffering (avoids ERR_HTTP2_PROTOCOL_ERROR)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }
}
