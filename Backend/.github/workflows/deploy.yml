name: Deploy LearnBot Server

on:
  push:
    branches:
      - dynamic-update # UAT branch (matching deploy.sh)
      - main # PROD branch
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "UAT"
        type: choice
        options:
          - UAT
          - PROD
      branch:
        description: "Branch to deploy (optional, defaults to env branch)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: self-hosted
    concurrency:
      group: deploy-learnbot-server
      cancel-in-progress: false

    steps:
      # ======= SETUP ENVIRONMENT =======
      - name: Setup deployment environment
        id: setup
        run: |
          # Determine environment based on branch (matching deploy.sh logic)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            DEPLOY_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            DEPLOY_ENV="PROD"
          else
            DEPLOY_ENV="UAT"
          fi

          # Set environment variables and paths (matching deploy.sh exactly)
          DEPLOY_ENV_LOWER=$(echo "$DEPLOY_ENV" | tr '[:upper:]' '[:lower:]')

          case "$DEPLOY_ENV" in
            PROD)
              REPO_DIR="/opt/Learnbot-Server"
              PM2_NAMESPACE="prod"
              LOG_DIR="/opt/Learnbot-Server/logs"
              FLASK_PORT=8030
              PM2_ENV_FLAG="--env production"
              APP_FLASK="learnbot-flask"
              DEFAULT_BRANCH="main"
              ;;
            UAT)
              REPO_DIR="/opt/Learnbot-Server-UAT"
              PM2_NAMESPACE="uat"
              LOG_DIR="/opt/Learnbot-Server-UAT/logs"
              FLASK_PORT=8031
              PM2_ENV_FLAG=""
              APP_FLASK="learnbot-flask-uat"
              DEFAULT_BRANCH="dynamic-update"
              ;;
            *)
              echo "❌ Unknown environment: $DEPLOY_ENV"
              echo "   Expected: UAT or PROD"
              exit 1
              ;;
          esac

          # Export to GitHub environment and outputs
          echo "DEPLOY_ENV=$DEPLOY_ENV" >> $GITHUB_ENV
          echo "deploy_env=$DEPLOY_ENV" >> $GITHUB_OUTPUT
          echo "deploy_env_lower=$DEPLOY_ENV_LOWER" >> $GITHUB_OUTPUT
          echo "repo_dir=$REPO_DIR" >> $GITHUB_OUTPUT
          echo "pm2_namespace=$PM2_NAMESPACE" >> $GITHUB_OUTPUT
          echo "log_dir=$LOG_DIR" >> $GITHUB_OUTPUT
          echo "flask_port=$FLASK_PORT" >> $GITHUB_OUTPUT
          echo "pm2_env_flag=$PM2_ENV_FLAG" >> $GITHUB_OUTPUT
          echo "app_flask=$APP_FLASK" >> $GITHUB_OUTPUT
          echo "default_branch=$DEFAULT_BRANCH" >> $GITHUB_OUTPUT
          echo "env_file=$REPO_DIR/.env.$DEPLOY_ENV_LOWER" >> $GITHUB_OUTPUT

      # ======= SETUP LOG DIRECTORY =======
      - name: Setup log directory
        run: |
          LOG_DIR="${{ steps.setup.outputs.log_dir }}"
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"

          # Create log directory with proper permissions
          sudo mkdir -p "$LOG_DIR"
          sudo chown deploy:deploy "$LOG_DIR"
          sudo chmod 755 "$LOG_DIR"

          echo "✅ Log directory created: $LOG_DIR"

          # Clean up old log files (older than 30 days)
          sudo -u deploy find "$LOG_DIR" -name "*.log" -mtime +30 -delete 2>/dev/null || true
          echo "🧹 Cleaned up old log files"

      # ======= GIT CONFIG & CHECKOUT =======
      - name: Configure Git and checkout
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: false

      # ======= PYTHON SETUP =======
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # ======= ENSURE REPO EXISTS (first-run clone) =======
      - name: Ensure repo exists on server
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          DEFAULT_BRANCH="${{ steps.setup.outputs.default_branch }}"
          if ! sudo -u deploy test -d "$REPO_DIR/.git"; then
            if [ -d "$REPO_DIR" ]; then
              echo "📂 Directory exists at $REPO_DIR but is not a git repo - initializing..."
              sudo chown -R deploy:deploy "$REPO_DIR"
              sudo -u deploy git -C "$REPO_DIR" init
              sudo -u deploy git -C "$REPO_DIR" remote add origin https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }} 2>/dev/null || \
                sudo -u deploy git -C "$REPO_DIR" remote set-url origin https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}
              sudo -u deploy git -C "$REPO_DIR" fetch origin
              sudo -u deploy git -C "$REPO_DIR" reset --hard "origin/$DEFAULT_BRANCH"
              echo "✅ Initialized existing directory as git repo at $REPO_DIR"
            else
              echo "📂 Repo not found at $REPO_DIR - cloning..."
              sudo mkdir -p "$(dirname "$REPO_DIR")"
              sudo chown deploy:deploy "$(dirname "$REPO_DIR")"
              sudo -u deploy git clone --branch "$DEFAULT_BRANCH" https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }} "$REPO_DIR"
              echo "✅ Cloned repo to $REPO_DIR"
            fi
          else
            echo "✅ Repo already exists at $REPO_DIR"
          fi

      # ======= BACKUP =======
      - name: Backup current deployment
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          BACKUP_DIR="$REPO_DIR/backups"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          sudo -u deploy mkdir -p "$BACKUP_DIR"
          if [ -d "$REPO_DIR" ] && [ "$(ls -A $REPO_DIR 2>/dev/null)" ]; then
            echo "📦 Creating backup..."
            sudo -u deploy tar -czf "$BACKUP_DIR/backup-$TIMESTAMP.tar.gz" \
              -C "$REPO_DIR" \
              --exclude="venv" \
              --exclude="__pycache__" \
              --exclude="*.log" \
              --exclude="backups" \
              --exclude="*.pyc" \
              . 2>/dev/null || true
          fi

      # ======= UPDATE GIT REMOTE =======
      - name: Update Git remote with current PAT
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          cd "$REPO_DIR"
          sudo -u deploy git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}
          echo "✅ Updated Git remote URL with current PAT"

      # ======= UPDATE CODE =======
      - name: Pull latest code
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          DEFAULT_BRANCH="${{ steps.setup.outputs.default_branch }}"

          # Use branch from workflow_dispatch input or default to environment branch
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.branch }}" ]; then
            DEPLOY_BRANCH="${{ github.event.inputs.branch }}"
          else
            DEPLOY_BRANCH="${{ github.ref_name }}"
            # If ref_name doesn't match expected branch, use default for environment
            if [ "$DEPLOY_BRANCH" != "$DEFAULT_BRANCH" ]; then
              DEPLOY_BRANCH="$DEFAULT_BRANCH"
            fi
          fi

          cd "$REPO_DIR"

          # Remove any leftover submodule state if present
          sudo -u deploy git submodule deinit -f --all 2>/dev/null || true
          sudo -u deploy rm -rf .git/modules 2>/dev/null || true

          sudo -u deploy git reset --hard HEAD
          sudo -u deploy git clean -fd -e venv -e backups -e logs -e vector-stores 2>/dev/null || true

          sudo -u deploy git fetch --all
          sudo -u deploy git checkout "$DEPLOY_BRANCH"

          # Reset to remote branch to ensure server matches repository exactly
          echo "🔄 Resetting to match remote branch exactly..."
          sudo -u deploy git reset --hard "origin/$DEPLOY_BRANCH"
          echo "✅ Reset to latest code from branch: $DEPLOY_BRANCH (commit: $(sudo -u deploy git rev-parse --short HEAD))"

      # ======= START DOCKER SERVICES (Qdrant + RabbitMQ) =======
      - name: Start Docker services (Qdrant + RabbitMQ)
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          cd "$REPO_DIR"

          # Ensure Qdrant storage directory exists
          sudo mkdir -p "$REPO_DIR/vector-stores/qdrant"
          sudo chown deploy:deploy "$REPO_DIR/vector-stores/qdrant" 2>/dev/null || true
          sudo chmod 755 "$REPO_DIR/vector-stores/qdrant"

          if [ ! -f docker-compose.yml ]; then
            echo "⚠️ docker-compose.yml not found - skipping Docker services"
            exit 0
          fi

          # Prefer Docker Compose V2, fallback to V1
          COMPOSE_CMD="docker compose"
          command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1 || COMPOSE_CMD="docker-compose"

          # `docker compose up -d` is idempotent: it leaves running containers
          # alone and (re)creates only those that are stopped or missing. It is
          # compose-project-scoped, so it only touches containers defined in THIS
          # compose file — it will NEVER kill the other environment's container,
          # even if container names would otherwise collide.
          #
          # IMPORTANT: do NOT run `docker stop learnbot-qdrant` or
          # `docker rm -f learnbot-qdrant` here. Those commands operate by
          # container name across the whole Docker daemon, and would cascade-
          # kill whichever environment currently owns that name — previously
          # this caused UAT deploys to take down PROD Qdrant (and vice versa).
          echo "🐳 Starting Qdrant + RabbitMQ via docker compose..."
          if ! sudo $COMPOSE_CMD up -d qdrant rabbitmq; then
            echo "❌ docker compose up failed for qdrant/rabbitmq"
            sudo $COMPOSE_CMD logs --tail 80 qdrant rabbitmq 2>&1 || true
            exit 1
          fi

          # Allow services to fully boot before downstream steps connect
          sleep 10

          # Confirm both services are running. Any non-running state fails the deploy.
          sudo $COMPOSE_CMD ps
          if ! sudo $COMPOSE_CMD ps qdrant | grep -qE "running|Up"; then
            echo "❌ Qdrant did not enter a running state"
            sudo $COMPOSE_CMD logs --tail 80 qdrant
            exit 1
          fi
          if ! sudo $COMPOSE_CMD ps rabbitmq | grep -qE "running|Up"; then
            echo "❌ RabbitMQ did not enter a running state"
            sudo $COMPOSE_CMD logs --tail 80 rabbitmq
            exit 1
          fi
          echo "✅ Qdrant + RabbitMQ are running"

      # ======= CREATE ENV FILE =======
      # Secrets must be named with _PROD or _UAT suffix, e.g. QDRANT_URL_PROD, DB_HOST_PROD (not QDRANT_URL).
      - name: Create environment file
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          cd "$REPO_DIR"

          # Create .env file with all backend environment variables (values quoted so spaces in secrets work)
          # GitHub Secrets: use QDRANT_URL_PROD / QDRANT_URL_UAT (not QDRANT_URL) for the Qdrant URL.
          sudo -u deploy bash -c "cat > .env.${{ steps.setup.outputs.deploy_env_lower }} << 'ENVEOF'
          FLASK_ENV=production
          NAMESPACE=${{ steps.setup.outputs.pm2_namespace }}
          PORT=${{ steps.setup.outputs.flask_port }}
          DB_HOST="${{ secrets[format('DB_HOST_{0}', env.DEPLOY_ENV)] }}"
          DB_PORT="${{ secrets[format('DB_PORT_{0}', env.DEPLOY_ENV)] }}"
          DB_NAME="${{ secrets[format('DB_NAME_{0}', env.DEPLOY_ENV)] }}"
          DB_USER="${{ secrets[format('DB_USER_{0}', env.DEPLOY_ENV)] }}"
          DB_PASSWORD="${{ secrets[format('DB_PASSWORD_{0}', env.DEPLOY_ENV)] }}"
          ANTHROPIC_API_KEY="${{ secrets[format('ANTHROPIC_API_KEY_{0}', env.DEPLOY_ENV)] }}"
          CLAUDE_MODEL_ID="${{ secrets[format('CLAUDE_MODEL_ID_{0}', env.DEPLOY_ENV)] }}"
          GMAIL_USER="${{ secrets[format('GMAIL_USER_{0}', env.DEPLOY_ENV)] }}"
          GMAIL_APP_PASSWORD="${{ secrets[format('GMAIL_APP_PASSWORD_{0}', env.DEPLOY_ENV)] }}"
          QDRANT_URL="${{ secrets[format('QDRANT_URL_{0}', env.DEPLOY_ENV)] }}"
          QDRANT_API_KEY="${{ secrets[format('QDRANT_API_KEY_{0}', env.DEPLOY_ENV)] }}"
          REMOTE_BLACKWELL_URL="${{ secrets[format('REMOTE_BLACKWELL_URL_{0}', env.DEPLOY_ENV)] }}"
          REMOTE_BLACKWELL_MODEL="${{ secrets[format('REMOTE_BLACKWELL_MODEL_{0}', env.DEPLOY_ENV)] }}"
          ALLOWED_ORIGINS="${{ secrets[format('ALLOWED_ORIGINS_{0}', env.DEPLOY_ENV)] }}"
          SECRET_KEY="${{ secrets[format('SECRET_KEY_{0}', env.DEPLOY_ENV)] }}"
          LOG_LEVEL=${{ steps.setup.outputs.pm2_namespace == 'prod' && 'info' || 'debug' }}
          ENVEOF"

          echo "✅ Environment file created: .env.${{ steps.setup.outputs.deploy_env_lower }}"

      # ======= PYTHON SECURITY AUDIT =======
      - name: Run pip-audit (security check)
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          cd "$REPO_DIR"

          echo "🔒 Running pip-audit for security vulnerabilities..."
          sudo -u deploy bash -c "source venv/bin/activate && \
            pip-audit --desc" || true

          # Check for critical/high vulnerabilities
          AUDIT_OUTPUT=$(sudo -u deploy bash -c "source venv/bin/activate && \
            pip-audit --format json --desc" 2>/dev/null || echo '{"vulnerabilities":[]}')

          # Count critical and high severity vulnerabilities
          CRITICAL=$(echo "$AUDIT_OUTPUT" | jq -r '[.vulnerabilities[] | select(.severity == "CRITICAL" or (.aliases[]? | test("CRITICAL"; "i")))] | length // 0')
          HIGH=$(echo "$AUDIT_OUTPUT" | jq -r '[.vulnerabilities[] | select(.severity == "HIGH" or (.aliases[]? | test("HIGH"; "i")))] | length // 0')

          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "❌ CRITICAL or HIGH severity vulnerabilities found!"
            echo "   Critical: $CRITICAL"
            echo "   High: $HIGH"
            echo "   Please update vulnerable packages in requirements.txt before deploying."
            exit 1
          fi
          echo "✅ pip-audit passed - no critical or high severity vulnerabilities"

      # ======= SETUP PYTHON VENV =======
      - name: Setup Python virtual environment
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          VENV_PATH="$REPO_DIR/venv"

          echo "🐍 Setting up Python virtual environment..."
          cd "$REPO_DIR"

          # Create venv if it doesn't exist
          if [ ! -d "$VENV_PATH" ]; then
            sudo -u deploy python3 -m venv venv
          fi

          # Activate venv and upgrade pip
          sudo -u deploy bash -c "source venv/bin/activate && \
            pip3 install --upgrade pip && \
            pip3 install pip-audit && \
            pip3 install -r requirements.txt"

          echo "✅ Python dependencies installed"

      # ======= RESTART PM2 SERVICES =======
      - name: Restart PM2 service (zero downtime)
        run: |
          set +e  # Don't exit on errors - we check pm2 start explicitly

          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          ENV_FILE="${{ steps.setup.outputs.env_file }}"
          PM2_NAMESPACE="${{ steps.setup.outputs.pm2_namespace }}"
          APP_FLASK="${{ steps.setup.outputs.app_flask }}"
          PM2_ENV_FLAG="${{ steps.setup.outputs.pm2_env_flag }}"
          FLASK_PORT="${{ steps.setup.outputs.flask_port }}"

          cd "$REPO_DIR"

          # Copy environment file
          echo "📋 Copying environment file..."
          sudo -u deploy cp "$ENV_FILE" .env
          sudo -u deploy chmod 644 .env
          echo "✅ .env file is ready at: $(pwd)/.env"

          # Flush old PM2 logs before restart
          echo "🧹 Flushing PM2 logs..."
          sudo -u deploy bash -lc "pm2 flush"

          # Clear Python cache to ensure fresh bytecode
          echo "🧹 Clearing Python cache..."
          sudo -u deploy find . -type d -name "__pycache__" -exec rm -r {} + 2>/dev/null
          sudo -u deploy find . -name "*.pyc" -delete 2>/dev/null
          sudo -u deploy find . -name "*.pyo" -delete 2>/dev/null

          # Flask - delete and start fresh to ensure env vars are reloaded
          echo "🔄 Managing Flask service..."

          # Delete existing process if present
          if sudo -u deploy bash -lc "pm2 describe '$APP_FLASK'" >/dev/null 2>&1; then
            echo "  🗑️  Force deleting $APP_FLASK to ensure fresh start..."
            sudo -u deploy bash -lc "pm2 delete '$APP_FLASK'"
            sleep 2
          fi

          # Check and kill any processes still holding the Flask port
          PORT_IN_USE=$(sudo -u deploy lsof -ti:$FLASK_PORT 2>/dev/null || echo "")
          if [ -n "$PORT_IN_USE" ]; then
            echo "  ⚠️  Flask port $FLASK_PORT is still in use, killing process..."
            sudo kill -9 $PORT_IN_USE 2>/dev/null
            sleep 1
          fi

          # START THE APP - this is the critical command
          echo "  ▶️ Starting $APP_FLASK with fresh environment from .env file..."
          sudo -u deploy bash -lc "cd '$REPO_DIR' && NAMESPACE='$PM2_NAMESPACE' pm2 start ecosystem.config.js $PM2_ENV_FLAG --only '$APP_FLASK' --namespace '$PM2_NAMESPACE'"
          START_EXIT=$?

          if [ $START_EXIT -ne 0 ]; then
            echo "❌ pm2 start FAILED with exit code $START_EXIT"
            echo "--- PM2 logs for debugging ---"
            sudo -u deploy bash -lc "pm2 logs --lines 30 --nostream" 2>&1 || true
            echo "--- PM2 list ---"
            sudo -u deploy bash -lc "pm2 list" 2>&1 || true
            echo "--- Port $FLASK_PORT check ---"
            sudo lsof -i:$FLASK_PORT 2>&1 || true
            exit 1
          fi

          # Save PM2 state
          sudo -u deploy bash -lc "pm2 save"

          # Show PM2 status for debugging
          echo "📋 PM2 Status:"
          sudo -u deploy bash -lc "pm2 status"

          # Verify log files are being created
          echo "📝 Log files:"
          ls -la "${{ steps.setup.outputs.log_dir }}/" 2>/dev/null || echo "Log directory not yet created"

          echo "✅ PM2 restart complete"

      # ======= HEALTH CHECK =======
      - name: Health check
        run: |
          # Wait for services to start
          echo "⏳ Waiting for service to start..."
          sleep 15

          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          PM2_NAMESPACE="${{ steps.setup.outputs.pm2_namespace }}"
          APP_FLASK="${{ steps.setup.outputs.app_flask }}"
          PORT="${{ steps.setup.outputs.flask_port }}"

          echo "🔍 Checking service..."
          echo "Flask port: $PORT"

          # Check Flask API (do not source .env - values may contain chars that run as commands)
          if ! curl -f http://localhost:${PORT}/health 2>/dev/null; then
            echo "⚠️ Flask health check failed, checking PM2 logs..."
            sudo -u deploy bash -lc "pm2 logs --lines 20 --nostream" || true
            echo "⚠️ Continuing despite health check failure..."
          else
            echo "✅ Flask API is running on port $PORT"
          fi

          # Verify PM2 service is running
          FLASK_STATUS=$(sudo -u deploy bash -lc "pm2 jlist" | jq -r ".[] | select(.namespace == \"$PM2_NAMESPACE\" and (.name | contains(\"flask\"))) | .pm2_env.status" | head -1)

          echo "📊 Service Status:"
          echo "  Flask: $FLASK_STATUS"

      # ======= CLEANUP =======
      - name: Cleanup old backups
        if: success()
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          BACKUP_DIR="$REPO_DIR/backups"
          # Keep only 3 most recent backups
          sudo -u deploy bash -c "ls -t $BACKUP_DIR/backup-*.tar.gz 2>/dev/null | tail -n +4 | xargs -r rm -f" || true

          # Cleanup old log files (older than 30 days)
          LOG_DIR="${{ steps.setup.outputs.log_dir }}"
          sudo -u deploy find "$LOG_DIR" -name "*.log" -mtime +30 -delete 2>/dev/null || true

      # ======= FAILURE HANDLING =======
      - name: Rollback and notify on failure
        if: failure()
        run: |
          REPO_DIR="${{ steps.setup.outputs.repo_dir }}"
          BACKUP_DIR="$REPO_DIR/backups"
          PM2_NAMESPACE="${{ steps.setup.outputs.pm2_namespace }}"

          # Find and restore latest backup
          LATEST_BACKUP=$(ls -t $BACKUP_DIR/backup-*.tar.gz 2>/dev/null | head -1)
          if [ -n "$LATEST_BACKUP" ]; then
            echo "🔄 Rolling back to $LATEST_BACKUP"
            cd "$REPO_DIR"
            # Ignore timestamp errors (not critical - files still extract correctly)
            sudo -u deploy tar -xzf "$LATEST_BACKUP" -C "$REPO_DIR" 2>&1 | grep -v "Cannot utime" || true
            echo "✅ Rollback complete"
          else
            echo "⚠️ No backup found to rollback"
          fi

          if [ -n "${{ secrets.TEAMS_WEBHOOK_URL }}" ]; then
            curl -H "Content-Type: application/json" \
                 -d '{"summary":"❌ LearnBot Server deployment failed ('${{ env.DEPLOY_ENV }}')"}' \
                 "${{ secrets.TEAMS_WEBHOOK_URL }}" || true
          fi
